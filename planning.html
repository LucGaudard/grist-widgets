<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning des séances</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}header{position:sticky;top:0;z-index:2;background:Canvas;border-bottom:1px solid #9995;padding:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}button{cursor:pointer;border:1px solid #9996;background:Canvas;color:CanvasText;border-radius:8px;padding:7px 10px}#month{font-weight:700;text-transform:capitalize}main{padding:8px 12px 28px;max-width:920px;margin:auto}.day{display:grid;grid-template-columns:75px 1fr;gap:10px;border-bottom:1px solid #9993;padding:18px 0}.date{position:sticky;top:62px;align-self:start;font-size:13px;color:GrayText;text-transform:uppercase}.date strong{display:block;font-size:27px;color:CanvasText}.events{display:grid;gap:8px}.event{border:0;border-left:5px solid var(--accent);background:var(--bg);color:#1d2733;text-align:left;padding:12px 14px;border-radius:7px;width:100%}.event strong{display:block;font-size:15px;margin:4px 0}.event small{font-size:12px}.event.selected{outline:2px solid #2767ce;outline-offset:2px}#message{padding:25px;text-align:center;color:GrayText}.muted{color:GrayText;font-size:12px}@media(max-width:450px){.day{grid-template-columns:55px 1fr}.date strong{font-size:24px}header{padding:9px}}
</style></head><body><header><button id="prev" aria-label="Mois précédent">‹</button><span id="month"></span><button id="next" aria-label="Mois suivant">›</button><button id="today">Aujourd'hui</button></header><main id="list"></main><div id="message"></div>
<script>
'use strict';
const F={start:'Date_debut',end:'Date_fin',title:'Libelle_calendrier',type:'Cours_Type'};
let records=[],selected=null,anchor=new Date();anchor.setDate(1);anchor.setHours(0,0,0,0);
const fmtTime=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});
const fmtMonth=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric',timeZone:'Europe/Paris'});
const fmtDay=new Intl.DateTimeFormat('fr-FR',{weekday:'short',timeZone:'Europe/Paris'});
const fmtKey=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Europe/Paris'});
const palette={'CM':['#0e948a','#dcf5f0'],'TD':['#387ad7','#e3efff'],'TP':['#c27c13','#fff1d8'],'Atelier':['#8b58c7','#f1e7ff']};
function asDate(v){if(v==null||v==='')return null;if(v instanceof Date)return Number.isNaN(+v)?null:v;if(typeof v==='number')return new Date(v*1000);const d=new Date(v);return Number.isNaN(+d)?null:d}
function monthKey(d){return fmtKey.format(d).slice(0,7)}
function render(){document.getElementById('month').textContent=fmtMonth.format(anchor);const list=document.getElementById('list');list.replaceChildren();let valid=records.map(r=>({...r,_start:asDate(r[F.start]),_end:asDate(r[F.end])})).filter(r=>r._start&&monthKey(r._start)===monthKey(anchor)).sort((a,b)=>a._start-b._start);const groups=new Map();for(const r of valid){const k=fmtKey.format(r._start);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}for(const [key,items] of groups){const day=document.createElement('section');day.className='day';const date=document.createElement('div');date.className='date';date.textContent=fmtDay.format(items[0]._start);const num=document.createElement('strong');num.textContent=key.slice(-2);date.append(num);day.append(date);const events=document.createElement('div');events.className='events';for(const r of items){const btn=document.createElement('button');btn.className='event'+(r.id===selected?' selected':'');const t=String(r[F.type]||'Autre');const col=palette[t]||['#697586','#e9edf2'];btn.style.setProperty('--accent',col[0]);btn.style.setProperty('--bg',col[1]);const time=document.createElement('small');time.textContent=fmtTime.format(r._start)+(r._end?' – '+fmtTime.format(r._end):'');const title=document.createElement('strong');title.textContent=String(r[F.title]||'Séance sans titre');const typ=document.createElement('small');typ.textContent=t;btn.append(time,title,typ);btn.onclick=()=>{selected=r.id;render();grist.setCursorPos({rowId:r.id}).catch(e=>console.error('Sélection Grist impossible',e))};events.append(btn)}day.append(events);list.append(day)}document.getElementById('message').textContent=groups.size?'':'Aucune séance prévue ce mois-ci.'}
document.getElementById('prev').onclick=()=>{anchor.setMonth(anchor.getMonth()-1);render()};document.getElementById('next').onclick=()=>{anchor.setMonth(anchor.getMonth()+1);render()};document.getElementById('today').onclick=()=>{anchor=new Date();anchor.setDate(1);anchor.setHours(0,0,0,0);render()};
grist.ready({requiredAccess:'read table',allowSelectBy:true});
grist.onRecords(data=>{records=data||[];render()});
grist.onRecord(r=>{if(r&&r.id!=null){selected=r.id;render()}});
render();
</script></body></html>
