<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning des séances</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}header{position:sticky;top:0;z-index:2;background:Canvas;border-bottom:1px solid #9995;padding:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}button{cursor:pointer;border:1px solid #9996;background:Canvas;color:CanvasText;border-radius:8px;padding:7px 10px}#month{font-weight:700;text-transform:capitalize}main{padding:8px 12px 28px;max-width:920px;margin:auto}.day{display:grid;grid-template-columns:75px 1fr;gap:10px;border-bottom:1px solid #9993;padding:18px 0}.day{scroll-margin-top:64px}.date{position:sticky;top:62px;align-self:start;font-size:13px;color:GrayText;text-transform:uppercase}.date strong{display:block;font-size:27px;color:CanvasText}.events{display:grid;gap:8px}.event{border:0;border-left:5px solid var(--accent);background:var(--bg);color:#1d2733;text-align:left;padding:12px 14px;border-radius:7px;width:100%}.event strong{display:block;font-size:15px;margin:4px 0}.event small{font-size:12px}.event.selected{outline:2px solid #2767ce;outline-offset:2px}#message{padding:25px;text-align:center;color:GrayText}.muted{color:GrayText;font-size:12px}@media(max-width:450px){.day{grid-template-columns:55px 1fr}.date strong{font-size:24px}header{padding:9px}}
</style></head><body><header><button id="prev" aria-label="Mois précédent">‹</button><span id="month"></span><button id="next" aria-label="Mois suivant">›</button><button id="today">Aujourd'hui</button></header><div id="diagnostic" role="status" style="padding:9px 12px;background:#fff0cf;color:#513700;font-size:12px"></div><main id="list"></main><div id="message"></div>
<script>
'use strict';
const F={start:'Date_debut',end:'Date_fin',title:'Libelle_calendrier',type:'Cours_Type'};
let records=[],selected=null,anchor=new Date();anchor.setDate(1);anchor.setHours(0,0,0,0);
const fmtTime=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});
const fmtMonth=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric',timeZone:'Europe/Paris'});
const fmtDay=new Intl.DateTimeFormat('fr-FR',{weekday:'short',timeZone:'Europe/Paris'});
const fmtKey=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Europe/Paris'});
let categoryColors={}, courseCategories={}, sessionCourses={};
let colorError='';
let diagnosticStats={courses:0,colors:0,matched:0,withCategory:0};
const fallback=['#697586','#e9edf2'];
function tableRows(data){if(Array.isArray(data))return data;const ids=data?.id||[];return ids.map((id,i)=>Object.fromEntries(Object.entries(data).map(([k,v])=>[k,Array.isArray(v)?v[i]:v]).concat([['id',id]])))}
async function loadCategoryColors(){
 const issues=[];
 let tables,columns,courses,sessions;
 for(const [name,fetch] of [
  ['Cours',()=>grist.docApi.fetchTable('Cours')],
  ['Seances',()=>grist.docApi.fetchTable('Seances')],
  ['_grist_Tables',()=>grist.docApi.fetchTable('_grist_Tables')],
  ['_grist_Tables_column',()=>grist.docApi.fetchTable('_grist_Tables_column')]
 ]){
  try{
   const data=await fetch();
   if(name==='Cours')courses=data;
   else if(name==='Seances')sessions=data;
   else if(name==='_grist_Tables')tables=data;
   else columns=data;
   console.info('[Planning V3] Table lue :',name,'lignes :',tableRows(data).length);
  }catch(e){issues.push(name+' : '+(e?.message||String(e)));console.error('[Planning V3] Lecture impossible :',name,e)}
 }
 if(sessions){
  sessionCourses=Object.fromEntries(tableRows(sessions).map(r=>[Number(r.id),r.Cours]));
 }
 if(courses){
  const rows=tableRows(courses);
  courseCategories=Object.fromEntries(rows.map(c=>[Number(c.id),String(c.CatCours||'')]));
  diagnosticStats.courses=rows.length;
  console.info('[Planning V3] Catégories de cours :',Object.keys(courseCategories).length);
 }
 if(tables&&columns){
  const table=tableRows(tables).find(t=>t.tableId==='Cours');
  const col=tableRows(columns).find(c=>Number(c.parentId)===Number(table?.id)&&c.colId==='CatCours');
  if(!table)issues.push('Table Cours absente des métadonnées');
  else if(!col)issues.push('Colonne Cours.CatCours absente des métadonnées');
  else{
   try{
    const opts=JSON.parse(col.widgetOptions||'{}').choiceOptions||{};
    categoryColors=Object.fromEntries(Object.entries(opts).filter(([,style])=>style?.fillColor).map(([name,style])=>[name,style.fillColor]));
    console.info('[Planning V3] Couleurs récupérées :',categoryColors);
    if(!Object.keys(categoryColors).length)issues.push('Aucune couleur trouvée dans Cours.CatCours.choiceOptions');
   }catch(e){issues.push('Analyse widgetOptions : '+e.message)}
  }
 }
 colorError=issues.join(' | ');
 diagnosticStats.colors=Object.keys(categoryColors).length;
 render();
}
function categoryFor(r){const ref=sessionCourses[Number(r.id)]??r.Cours;const id=typeof ref==='number'?ref:Number(ref);return courseCategories[id]||''}
function contrast(hex){const h=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return '#1d2733';const rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722>.45?'#1d2733':'#fff'}
function asDate(v){if(v==null||v==='')return null;if(v instanceof Date)return Number.isNaN(+v)?null:v;if(typeof v==='number')return new Date(v*1000);const d=new Date(v);return Number.isNaN(+d)?null:d}
function monthKey(d){return fmtKey.format(d).slice(0,7)}
function render(){
 const withCategory=records.filter(r=>!!categoryFor(r)).length;
 const matched=records.filter(r=>!!categoryColors[categoryFor(r)]).length;
 diagnosticStats.withCategory=withCategory;diagnosticStats.matched=matched;
 const diag=document.getElementById('diagnostic');
 diag.textContent='DIAGNOSTIC V3.1 — Séances : '+records.length+' | Cours : '+diagnosticStats.courses+' | Catégories trouvées : '+withCategory+' | Couleurs définies : '+diagnosticStats.colors+' | Séances avec cours : '+records.filter(r=>!!sessionCourses[Number(r.id)]).length+' | Séances colorables : '+matched+(colorError?' | ERREUR : '+colorError:'');
 document.getElementById('month').textContent=fmtMonth.format(anchor);const list=document.getElementById('list');list.replaceChildren();let valid=records.map(r=>({...r,_start:asDate(r[F.start]),_end:asDate(r[F.end])})).filter(r=>r._start&&r._start>=new Date(anchor.getFullYear(),anchor.getMonth()-1,1)&&r._start<new Date(anchor.getFullYear(),anchor.getMonth()+2,1)).sort((a,b)=>a._start-b._start);const groups=new Map();for(const r of valid){const k=fmtKey.format(r._start);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}for(const [key,items] of groups){const day=document.createElement('section');day.className='day';day.dataset.date=key;const date=document.createElement('div');date.className='date';date.textContent=fmtDay.format(items[0]._start);const num=document.createElement('strong');num.textContent=key.slice(-2);date.append(num);day.append(date);const events=document.createElement('div');events.className='events';for(const r of items){const btn=document.createElement('button');btn.className='event'+(r.id===selected?' selected':'');btn.dataset.rowid=String(r.id);const t=String(r[F.type]||'Autre');const cat=categoryFor(r);const bg=categoryColors[cat]||fallback[1];btn.style.setProperty('--accent',bg);btn.style.setProperty('--bg',bg);btn.style.color=contrast(bg);const time=document.createElement('small');time.textContent=fmtTime.format(r._start)+(r._end?' – '+fmtTime.format(r._end):'');const title=document.createElement('strong');title.textContent=String(r[F.title]||'Séance sans titre');const typ=document.createElement('small');typ.textContent=cat?cat+' · '+t:t;btn.append(time,title,typ);btn.onclick=()=>{selected=r.id;document.querySelectorAll('.event.selected').forEach(e=>e.classList.remove('selected'));btn.classList.add('selected');grist.setCursorPos({rowId:r.id}).catch(e=>console.error('Sélection Grist impossible',e))};events.append(btn)}day.append(events);list.append(day)}document.getElementById('message').textContent=groups.size?'':'Aucune séance prévue sur cette période.'}
document.getElementById('prev').onclick=()=>{anchor.setMonth(anchor.getMonth()-1);render()};document.getElementById('next').onclick=()=>{anchor.setMonth(anchor.getMonth()+1);render()};function jumpToday(){const now=new Date();anchor=new Date(now.getFullYear(),now.getMonth(),1);render();const today=fmtKey.format(now);const days=[...document.querySelectorAll('.day')];const target=days.find(el=>el.dataset.date>=today);if(target){target.scrollIntoView({block:'start',behavior:'smooth'});}else{document.getElementById('message').textContent='Aucune séance à venir sur cette période.';}}
document.getElementById('today').onclick=jumpToday;
grist.ready({requiredAccess:'full',allowSelectBy:true});
grist.onRecords(data=>{records=data||[];render()});
grist.onRecord(r=>{if(r&&r.id!=null){selected=r.id;document.querySelectorAll('.event').forEach(el=>el.classList.remove('selected'));const found=records.find(x=>x.id===selected);if(found){const buttons=[...document.querySelectorAll('.event')];const matching=buttons.find(el=>el.dataset.rowid===String(selected));if(matching)matching.classList.add('selected');}}});
render();
loadCategoryColors();
</script></body></html>
