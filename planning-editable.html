<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning des séances</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}header{position:sticky;top:0;z-index:2;background:Canvas;border-bottom:1px solid #9995;padding:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}button{cursor:pointer;border:1px solid #9996;background:Canvas;color:CanvasText;border-radius:8px;padding:7px 10px}#month{font-weight:700;text-transform:capitalize}main{padding:8px 12px 28px;max-width:920px;margin:auto}.day{display:grid;grid-template-columns:75px 1fr;gap:10px;border-bottom:1px solid #9993;padding:18px 0}.day{scroll-margin-top:64px}.date{position:sticky;top:62px;align-self:start;font-size:13px;color:GrayText;text-transform:uppercase}.date strong{display:block;font-size:27px;color:CanvasText}.events{display:grid;gap:8px}.event{border:0;border-left:5px solid var(--accent);background:var(--bg);color:#1d2733;text-align:left;padding:12px 14px;border-radius:7px;width:100%}.event strong{display:block;font-size:15px;margin:4px 0}.event-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.event-group{font-size:11px;font-weight:650;padding:3px 7px;border-radius:5px;background:#ffffffa8;color:#1d2733;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}.event-group:empty{display:none}.event small{font-size:12px}.event.selected{outline:2px solid #2767ce;outline-offset:2px}#message{padding:25px;text-align:center;color:GrayText}.muted{color:GrayText;font-size:12px}@media(max-width:450px){.day{grid-template-columns:55px 1fr}.date strong{font-size:24px}header{padding:9px}}

.event-card{position:relative;border-left:5px solid var(--accent);background:var(--bg);color:var(--fg,#1d2733);border-radius:7px;overflow:hidden}
.event-card .event{background:transparent;border:0;border-radius:0;color:inherit}
.event-card .event-top{padding-right:75px;min-height:17px}
.event-card .event strong{padding-right:75px}
.event-card .event-group{position:absolute;top:12px;right:12px;max-width:calc(100% - 35px);z-index:1}
.event-card .event.selected{outline:2px solid #2767ce;outline-offset:-2px}
/* Indicateurs intégrés à la carte ; panneau dépliable sous son contenu. */
.event-main{display:flex;align-items:flex-end;gap:8px}
.event-main .event{flex:1;min-width:0;width:auto}
.event-actions{display:flex;align-items:center;gap:5px;padding:0 12px 12px 0;flex-shrink:0}
.event-indicator{width:25px;height:25px;display:grid;place-items:center;border:1px solid #1d273366;border-radius:50%;font-size:13px;font-weight:650;line-height:1;color:#1d2733;background:#ffffff55}
.event-toggle{border:0;background:transparent;color:#1d2733;padding:4px 3px;font-size:14px;line-height:1;min-width:20px}
.event-toggle[aria-expanded="true"]{transform:rotate(90deg)}
.event-details{border-top:1px solid #0002;padding:10px 12px 12px}
.event-details[hidden]{display:none}
.md-content{background:#ffffffdb;color:#1d2733;border-radius:6px;padding:9px 11px;overflow-wrap:anywhere;font-size:13px;line-height:1.5}
.md-content p{margin:0 0 8px}.md-content p:last-child{margin-bottom:0}.md-content ul,.md-content ol{padding-left:20px;margin:5px 0}.md-content a{color:#1452a0}.md-content pre{overflow:auto}.md-content img{max-width:100%;height:auto}
.event-details .section-title{font-size:12px;font-weight:700;margin:9px 0 5px}
.event-details .empty{font-size:12px;opacity:.75}

.edit-prereq{border:1px solid #7776;background:#fff;color:#1d2733;border-radius:4px;padding:2px 6px;font-size:16px;line-height:1.1;float:right}
.edit-prereq:disabled{opacity:.45;cursor:not-allowed}
.edit-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.edit-title .edit-prereq{float:none}
#editor-overlay[hidden]{display:none}#editor-overlay{position:fixed;inset:0;background:#ffffffb8;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#editor-dialog{width:min(470px,100%);height:min(590px,90vh);display:flex;flex-direction:column;gap:12px;background:Canvas;color:CanvasText;border:1px solid #9995;box-shadow:0 8px 30px #0002;padding:20px}
#editor-dialog h2{margin:0;font-size:16px}#editor-text{width:100%;flex:1;min-height:180px;resize:none;padding:12px;font:14px/1.5 ui-monospace,monospace;border:1px solid #9996;background:Canvas;color:CanvasText}
.editor-buttons{display:flex;justify-content:flex-end;gap:8px}#editor-error{color:#b42318;font-size:12px;min-height:16px}
</style></head><body><header><button id="prev" aria-label="Mois précédent">‹</button><span id="month"></span><button id="next" aria-label="Mois suivant">›</button><button id="today">Aujourd'hui</button></header><main id="list"></main><div id="message"></div><div id="editor-overlay" hidden><div id="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editor-heading"><h2 id="editor-heading">Modifier les prérequis</h2><textarea id="editor-text" spellcheck="true" aria-label="Prérequis en Markdown"></textarea><div id="editor-error" role="alert"></div><div class="editor-buttons"><button id="editor-cancel" type="button">Annuler</button><button id="editor-save" type="button">Enregistrer</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
'use strict';
const F={start:'Date_debut',end:'Date_fin',title:'Libelle_calendrier',type:'Cours_Type'};
let records=[],selected=null,anchor=new Date();anchor.setDate(1);anchor.setHours(0,0,0,0);
const fmtTime=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});
const fmtMonth=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric',timeZone:'Europe/Paris'});
const fmtDay=new Intl.DateTimeFormat('fr-FR',{weekday:'short',timeZone:'Europe/Paris'});
const fmtKey=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Europe/Paris'});
let sessionDetails=new Map(), sessionsByReference=new Map();
let colorError='';
let summaryGroups=new Map(),sourceRows=new Map(),editorRow=null,editorSourceId=null;
const fallback=['#697586','#e9edf2'];
function tableRows(data){if(Array.isArray(data))return data;const ids=data?.id||[];return ids.map((id,i)=>Object.fromEntries(Object.entries(data).map(([k,v])=>[k,Array.isArray(v)?v[i]:v]).concat([['id',id]])))}
function unwrapText(value){
 if(value==null)return '';
 let text=String(value).trim();
 for(let i=0;i<2;i++){
  if(!(text.startsWith('"')&&text.endsWith('"')))break;
  try{const parsed=JSON.parse(text);if(typeof parsed!=='string')break;text=parsed.trim()}catch(e){break}
 }
 return text;
}
function validColor(value){const color=unwrapText(value);return /^#[0-9a-f]{6}$/i.test(color)?color:null}
async function loadCategoryColors(){
 try{
  const sessions=tableRows(await grist.docApi.fetchTable('Seances'));
  sessionsByReference=new Map();
  sessionDetails=new Map();
  for(const row of sessions){
   const ref=unwrapText(row.Reference);
   if(ref){if(!sessionsByReference.has(ref))sessionsByReference.set(ref,[]);sessionsByReference.get(ref).push(row)}
   const sig=signature(row);
   if(!sessionDetails.has(sig))sessionDetails.set(sig,[]);
   sessionDetails.get(sig).push(row);
  }
  sourceRows=new Map(sessions.map(row=>[Number(row.id),row]));
 }catch(e){console.error('[Planning] Lecture Seances impossible :',e)}
 render();
}
function colorFor(r){
 const direct=validColor(r.Cours_CatCours);
 if(direct)return direct;
 const matches=sessionsByReference.get(unwrapText(r.Reference))||[];
 return matches.length===1?validColor(matches[0].Cours_CatCours):null;
}
function signature(r){
 const start=asDate(r.Date_debut), end=asDate(r.Date_fin);
 return [start?start.getTime():'',end?end.getTime():'',String(r.Libelle_calendrier||'').trim()].join('|');
}
function enrichment(r){
 const matches=sessionDetails.get(signature(r))||[];
 // Pas d'association ambiguë entre une synthèse et plusieurs séances sources.
 return matches.length===1?matches[0]:null;
}
function groupFor(r){return String(r.Groupe_sans_vague||enrichment(r)?.Groupe_sans_vague||'')}
function contrast(hex){const h=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return '#1d2733';const rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722>.45?'#1d2733':'#fff'}
function asDate(v){if(v==null||v==='')return null;if(v instanceof Date)return Number.isNaN(+v)?null:v;if(typeof v==='number')return new Date(v*1000);const d=new Date(v);return Number.isNaN(+d)?null:d}
function monthKey(d){return fmtKey.format(d).slice(0,7)}
function field(r,...keys){for(const key of keys){if(r[key]!==undefined&&r[key]!==null)return String(r[key])}return ''}
function addMarkdown(target,markdown){
 const text=String(markdown||'').trim();
 if(!text){const e=document.createElement('div');e.className='empty';e.textContent='Non renseigné';target.append(e);return}
 const content=document.createElement('div');content.className='md-content';
 if(window.marked&&window.DOMPurify){
  const raw=window.marked.parse(text,{gfm:true,breaks:true});
  content.innerHTML=window.DOMPurify.sanitize(raw);
  content.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});
 }else{content.textContent=text;content.style.whiteSpace='pre-wrap'}
 target.append(content);
}
function sourceIds(r){
 // La colonne Reference provient de la synthèse et désigne la séance source.
 // Ne jamais choisir arbitrairement une séance lorsque plusieurs références existent.
 const raw=r.Reference;
 const refs=[];
 function collect(value){
  if(value==null||value==='')return;
  if(Array.isArray(value)){
   for(const v of (value[0]==='L'?value.slice(1):value))collect(v);
   return;
  }
  if(typeof value==='number'){
   // Une valeur numérique seule peut être un identifiant source Grist.
   if(Number.isSafeInteger(value)&&value>0)refs.push(value);
   return;
  }
  const text=String(value).trim();
  if(text.startsWith('[')){
   try{const parsed=JSON.parse(text);if(Array.isArray(parsed)){collect(parsed);return}}catch(e){}
  }
  const matches=[...text.matchAll(/SEANCE0*([1-9]\d*)/gi)];
  if(matches.length){for(const m of matches)refs.push(Number(m[1]));return}
 }
 collect(raw);
 return [...new Set(refs)].filter(id=>{
  const row=sourceRows.get(id);
  return row && String(row.Reference||'').trim().toUpperCase()===('SEANCE'+String(id).padStart(6,'0'));
 });
}
function editorClose(){document.getElementById('editor-overlay').hidden=true;editorRow=null;editorSourceId=null}
function editorOpen(r){
 const ids=sourceIds(r);
 if(ids.length!==1||!sourceRows.has(ids[0])){alert('Édition impossible : la colonne Reference de cette carte ne permet pas d’identifier une séance source unique. Aucune modification effectuée.');return}
 editorRow=r;editorSourceId=ids[0];
 document.getElementById('editor-text').value=String(sourceRows.get(ids[0]).Prerequis||'');
 document.getElementById('editor-error').textContent='';
 document.getElementById('editor-overlay').hidden=false;
 document.getElementById('editor-text').focus();
}
document.getElementById('editor-cancel').onclick=editorClose;
document.getElementById('editor-overlay').addEventListener('click',e=>{if(e.target.id==='editor-overlay')editorClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('editor-overlay').hidden)editorClose()});
document.getElementById('editor-save').onclick=async()=>{
 if(editorSourceId==null)return;
 const btn=document.getElementById('editor-save');btn.disabled=true;btn.textContent='Enregistrement…';
 try{
  const value=document.getElementById('editor-text').value;
  await grist.docApi.applyUserActions([['UpdateRecord','Seances',editorSourceId,{Prerequis:value}]]);
  sourceRows.get(editorSourceId).Prerequis=value;
  if(editorRow)editorRow.Prerequis=value;
  editorClose();render();
 }catch(e){document.getElementById('editor-error').textContent='Enregistrement refusé ou impossible : '+(e?.message||String(e))}
 finally{btn.disabled=false;btn.textContent='Enregistrer'}
};
function render(){
 const monthLabel=fmtMonth.format(anchor);
 document.getElementById('month').textContent=monthLabel.charAt(0).toLocaleUpperCase('fr-FR')+monthLabel.slice(1);
 const list=document.getElementById('list');list.replaceChildren();
 const valid=records.map(r=>({...r,_start:asDate(r[F.start]),_end:asDate(r[F.end])}))
  .filter(r=>r._start && monthKey(r._start) === monthKey(anchor))
  .sort((a,b)=>a._start-b._start);
 const groups=new Map();for(const r of valid){const k=fmtKey.format(r._start);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
 for(const [key,items] of groups){
  const day=document.createElement('section');day.className='day';day.dataset.date=key;
  const date=document.createElement('div');date.className='date';date.textContent=fmtDay.format(items[0]._start);
  const num=document.createElement('strong');num.textContent=key.slice(-2);date.append(num);day.append(date);
  const events=document.createElement('div');events.className='events';
  for(const r of items){
   const card=document.createElement('article');card.className='event-card';
   const btn=document.createElement('button');btn.type='button';btn.className='event'+(r.id===selected?' selected':'');btn.dataset.rowid=String(r.id);
   const t=String(r[F.type]||enrichment(r)?.[F.type]||'Autre');const bg=colorFor(r)||fallback[1];
   card.style.setProperty('--accent',bg);card.style.setProperty('--bg',bg);card.style.setProperty('--fg',contrast(bg));
   const time=document.createElement('small');time.textContent=fmtTime.format(r._start)+(r._end?' – '+fmtTime.format(r._end):'');
   const top=document.createElement('div');top.className='event-top';
   const group=document.createElement('span');group.className='event-group';group.textContent=groupFor(r);if(group.textContent)group.title=group.textContent;
   top.append(time,group);const title=document.createElement('strong');title.textContent=String(r[F.title]||'Séance sans titre');
   const typ=document.createElement('small');typ.textContent=t;
   btn.append(top,title,typ);
   btn.onclick=()=>{selected=r.id;document.querySelectorAll('.event.selected').forEach(e=>e.classList.remove('selected'));btn.classList.add('selected');grist.setCursorPos({rowId:r.id}).catch(e=>console.error('Sélection Grist impossible',e))};
   const mainRow=document.createElement('div');mainRow.className='event-main';mainRow.append(btn);
   const ressources=field(r,'Ressources_associees');const prerequis=field(r,'Prerequis');
   const hasR=Boolean(ressources.trim()),hasP=Boolean(prerequis.trim());
   {
    const actions=document.createElement('div');actions.className='event-actions';
    for(const [label,exists,tooltip] of [['R',hasR,'Ressources associées disponibles'],['P',hasP,'Prérequis disponibles']]){
     if(!exists)continue;
     const indicator=document.createElement('span');indicator.className='event-indicator';indicator.textContent=label;indicator.title=tooltip;indicator.setAttribute('aria-label',tooltip);actions.append(indicator);
    }
    const details=document.createElement('div');details.className='event-details';details.hidden=true;
    details.id='details-'+String(r.id).replace(/[^a-zA-Z0-9_-]/g,'_');
    for(const [name,value] of [['Ressources associées',ressources],['Prérequis',prerequis]]){
     if(!value.trim()&&name!=='Prérequis')continue;
     const heading=document.createElement('div');heading.className='section-title';heading.textContent=name;
     if(name==='Prérequis'){
      heading.classList.add('edit-title');
      const pencil=document.createElement('button');pencil.type='button';pencil.className='edit-prereq';pencil.textContent='✎';pencil.title='Modifier les prérequis';pencil.setAttribute('aria-label','Modifier les prérequis');pencil.onclick=()=>editorOpen(r);
      const text=document.createElement('span');text.textContent=name;heading.append(text,pencil);
     }
     details.append(heading);
     addMarkdown(details,value);
    }
    const toggle=document.createElement('button');toggle.type='button';toggle.className='event-toggle';toggle.textContent='▸';toggle.title='Afficher les ressources et prérequis';toggle.setAttribute('aria-label','Afficher les ressources et prérequis');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-controls',details.id);
    toggle.onclick=()=>{details.hidden=!details.hidden;toggle.setAttribute('aria-expanded',String(!details.hidden));toggle.title=details.hidden?'Afficher les ressources et prérequis':'Masquer les ressources et prérequis';toggle.setAttribute('aria-label',toggle.title)};
    actions.append(toggle);mainRow.append(actions);card.append(mainRow,details);
   }
   events.append(card);
  }
  day.append(events);list.append(day);
 }
 document.getElementById('message').textContent=groups.size?'':'Aucune séance prévue sur cette période.';
}
document.getElementById('prev').onclick=()=>{anchor.setMonth(anchor.getMonth()-1);render()};document.getElementById('next').onclick=()=>{anchor.setMonth(anchor.getMonth()+1);render()};function jumpToday(){const now=new Date();anchor=new Date(now.getFullYear(),now.getMonth(),1);render();const today=fmtKey.format(now);const days=[...document.querySelectorAll('.day')];const target=days.find(el=>el.dataset.date>=today);if(target){target.scrollIntoView({block:'start',behavior:'smooth'});}else{document.getElementById('message').textContent='Aucune séance à venir sur cette période.';}}
document.getElementById('today').onclick=jumpToday;
grist.ready({requiredAccess:'full',allowSelectBy:true});
grist.onRecords(data=>{records=Array.isArray(data)?data:tableRows(data);console.info('[Planning V3.8] Lignes reçues de la source configurée :',records.length);render()});
grist.onRecord(r=>{if(r&&r.id!=null){selected=r.id;document.querySelectorAll('.event').forEach(el=>el.classList.remove('selected'));const found=records.find(x=>x.id===selected);if(found){const buttons=[...document.querySelectorAll('.event')];const matching=buttons.find(el=>el.dataset.rowid===String(selected));if(matching)matching.classList.add('selected');}}});
render();
loadCategoryColors();
</script></body></html>
